# @package _global_
# M2 PARTIAL — Deep-research agentic RL, COLOCATE partial rollout: AgenticPartialTrainer
# over the AgenticRolloutEngine (train + rollout time-share each GPU, TensorWeightSync).
# The synchronous partial-rollout sibling of deep_research_search_judge.yaml (barrier
# AgenticTrainer): over-samples `oversample_batch_size` prompt-groups, commits the freshest
# `batch_size` complete GRPO groups, and `abort`s the in-flight tail at a turn boundary.
# Cuts the straggler while keeping every GPU on generation; the per-token rollout-anchored
# ratio corrects a carried trajectory whose turns span multiple weight versions.
#
# Same tools (search + visit) and reward (LLM-as-judge) as the barrier recipe -- only the
# rollout-completion topology differs. Research trajectories are the workload this targets:
# a query needing eight search/visit round-trips otherwise gates the whole round.
#
# Prerequisites (operational -- set on the pod):
#   - QWEN3_INSTRUCT_PATH : local Qwen3-Instruct checkpoint dir
#   - DATA_PATH           : ASearcher jsonl (python -m unirl.utils.prepare_asearcher --out-dir data/asearcher)
#   - SERPER_KEY_ID       : Serper web-search API key (search tool)
#   - JINA_API_KEYS       : Jina reader key (visit tool)
#   - JUDGE_URL/JUDGE_MODEL: an OpenAI-compatible judge endpoint (e.g. a separate
#                            SGLang/vLLM server hosting Qwen2.5-72B-Instruct)
#   - SUMMARY_URL/SUMMARY_MODEL (optional): summarizer for the visit tool (the judge
#                            endpoint works); without it, visit returns raw page text.
#
# Run (single node, >=2 GPUs):
#   QWEN3_INSTRUCT_PATH=... DATA_PATH=data/asearcher/train.jsonl \
#   SERPER_KEY_ID=... JINA_API_KEYS=... JUDGE_URL=... JUDGE_MODEL=... \
#   python -m unirl.train_agentic_partial \
#     --config-name=deep_research/deep_research_search_judge_partial num_devices=2

defaults:
  - /_base/agentic/deep_research
  - _self_
oversample_batch_size: 6 # generate 6 prompt-groups/drive; commit the freshest 4 -> 2 slow groups carried
buffer_max_staleness: 1 # a completed buffered group may cross up to 1 weight sync before eviction
tail_policy: carry # SearchTool/VisitTool are stateless Tools; the carried Sample holds all resume state

# Colocate partial oversubscribes rank 0: its own run_drain + every worker's next_task pull +
# the poll->drain_completed fan + submit/abort/sync all ride these threaded-actor slots. Give it
# generous headroom (barrier only needs 8 because it never poll-fans).
worker_max_concurrency: 24

logging:
  run_name: deepresearch_search_judge_qwen3_partial
  tags: [deep-research, agentic, search, visit, llm-judge, qwen3, partial-rollout, colocate, carry, lin-531]
rollout:
  config:
    partial_rollout: true # LIN-531: abort->checkpoint->resume at turn boundaries
    inner:
      engine_kwargs:
        mem_fraction_static: 0.3 # colocate: shares the GPU with the FSDP train shard (sleep/wake)
sync:
  # Colocate full-weight push into the inner SGLang (delegated through the agentic engine). Runs in
  # the awake+decode-idle window abort() leaves.
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  bucket_size_mb: 64
data_source:
  args:
    algorithm:
      prompts_per_rollout: 6 # == oversample_batch_size (the per-drive prompt pool)
