# @package _global_
# M2 ASYNC — Deep-research agentic RL, DISAGGREGATED: AsyncAgenticTrainer over the
# AgenticRolloutEngine. The fully-async sibling of deep_research_search_judge.yaml
# (colocate barrier AgenticTrainer): training (FSDP) and the agentic rollout engine run on
# DISJOINT GPU slabs (train_fraction), the engine stays RESIDENT, and weights cross the
# slab boundary via NCCLWeightSync (not the colocate TensorWeightSync).
#
# Partial rollout: on each weight sync the trainer abort()s the in-flight tail at a TURN
# boundary (single-version Parts), syncs, and resumes the carried partials under the new
# weights. Safe here because SearchTool/VisitTool are stateless and the Sample contains the
# whole conversation. StatefulTool sessions (SandboxTool) must use tail_policy=drop until
# cross-worker stateful resume is implemented. buffer_max_staleness bounds staleness.
#
# Same tools (search + visit) and reward (LLM-as-judge) as the barrier recipe -- only the
# execution topology differs. Note the tradeoff: disaggregation halves the generation GPUs,
# which is why the colocate partial recipe is often the better lever for tool-bound work.
#
# Prerequisites (operational -- set on the pod):
#   - QWEN3_INSTRUCT_PATH : local Qwen3-Instruct checkpoint dir
#   - DATA_PATH           : ASearcher jsonl (python -m unirl.data.prepare.asearcher --out-dir data/asearcher)
#   - SERPER_KEY_ID       : Serper web-search API key (search tool)
#   - JINA_API_KEYS       : Jina reader key (visit tool)
#   - JUDGE_URL/JUDGE_MODEL: an OpenAI-compatible judge endpoint (e.g. a separate
#                            SGLang/vLLM server hosting Qwen2.5-72B-Instruct)
#   - SUMMARY_URL/SUMMARY_MODEL (optional): summarizer for the visit tool (the judge
#                            endpoint works); without it, visit returns raw page text.
#
# Run (single node, >=2 GPUs; train_fraction=0.5 -> 1 train + 1 rollout at num_devices=2):
#   QWEN3_INSTRUCT_PATH=... DATA_PATH=data/asearcher/train.jsonl \
#   SERPER_KEY_ID=... JINA_API_KEYS=... JUDGE_URL=... JUDGE_MODEL=... \
#   python -m unirl.train_agentic_async \
#     --config-name=deep_research/deep_research_search_judge_async num_devices=2

defaults:
  - /_base/agentic/deep_research
  - _self_
train_fraction: 0.5 # 0.5 * num_devices GPUs train (FSDP); the rest run the resident engine
# Over-sample the rollout slab: submit oversample_batch_size prompt-groups per drive so
# the slab stays busy across the sync-cycle (>= batch_size).
oversample_batch_size: 8
# Off-policy staleness budget: a buffered complete group may be up to this many weight
# syncs old before it is evicted. 0 = on-policy (ratio≈1); >0 = bounded off-policy.
buffer_max_staleness: 1
tail_policy: carry # SearchTool/VisitTool are stateless; the carried Sample resumes exactly

# rank-0 coordinator runs the background drain + serves next_task pulls + the
# poll/abort/drained control RPCs concurrently on a threaded Worker — needs >=3.
worker_max_concurrency: 8

# Per-turn stop: a tool-call turn ends at </tool_call> and yields to the tool.
logging:
  run_name: deepresearch_search_judge_qwen3_async
  tags: [deep-research, agentic, search, visit, llm-judge, qwen3, async, partial-rollout, carry, lin-531]
rollout:
  # Resident agentic engine on its own slab: the trainer submits drives, then reaps (poll)
  # and interrupts (abort). partial_rollout=true enables the turn-boundary
  # checkpoint/resume on each weight sync.
  config:
    partial_rollout: true # LIN-531: abort->checkpoint->resume at turn boundaries
    inner:
      engine_kwargs:
        mem_fraction_static: 0.8 # dedicated rollout slab: no FSDP shard to share the GPU with
sync:
  # Cross-slab full-weight sync (disaggregated): train rank 0 NCCL-broadcasts the full
  # dense FSDP weights into the resident agentic engine's inner SGLang
  # (init_weights_update_group + update_weights_from_distributed). flush_cache resets
  # SRT KV/prefix on the last bucket. Wired one-time by AsyncAgenticTrainer._connect_separate.
  _target_: unirl.distributed.weight_sync.full.nccl.NCCLWeightSync
  group_name: weight_sync
  bucket_size_mb: 512
data_source:
  args:
    algorithm:
      prompts_per_rollout: 8 # == oversample_batch_size (the producer's per-drive pool)
