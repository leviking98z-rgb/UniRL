# @package _global_
# Shared LTX-2 fields; public recipes add experiment-specific overrides.
num_devices: 8
batch_size: 8
logging:
  entity: ${oc.env:WANDB_ENTITY,null}
  log_media: true
  media_max_items: 4
bundle:
  _target_: unirl.models.ltx2.bundle.LTX2Bundle.from_config
pipeline:
  _target_: unirl.models.ltx2.pipeline.LTX2Pipeline.from_bundle
  config: ${bundle.config}
backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names:
    - "LTX2VideoTransformerBlock"
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn1.to_q
      - attn1.to_k
      - attn1.to_v
      - attn1.to_out.0
      - attn2.to_q
      - attn2.to_k
      - attn2.to_v
      - attn2.to_out.0
      - ff.net.0.proj
      - ff.net.2
reward:
  _target_: unirl.reward.service.RewardService
  backend:
    base_device: cuda
    config:
      device: auto
algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 5.0e-3
  clip_schedule: constant
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.ltx2.conditions.LTX2Conditions
  params: ${sampling}
stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1
data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  guidance_scale: 1.0
  height: 512
  width: 768
  eta: 0.7
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  logprob_precision: fp32
  scheduler:
    _target_: unirl.sde.scheduler.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    timestep_fraction:
      - 0
      - 0.5
