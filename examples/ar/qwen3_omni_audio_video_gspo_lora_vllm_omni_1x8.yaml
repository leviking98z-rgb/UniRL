# @package _global_
# Qwen3-Omni Thinker · GSPO + LoRA · Daily-Omni audio/video MCQA · vLLM-Omni.
# TP=4 is required because TP must divide the audio tower's 20 attention heads.
#
# Launch from the repository root:
#   QWEN3_OMNI_PATH=/path/to/Qwen3-Omni-30B-A3B-Instruct \
#   DATA_PATH=/path/to/daily_omni_av/train.jsonl \
#   EVAL_DATA_PATH=/path/to/daily_omni_av/val.jsonl \
#   ENTRY=train_ar bash examples/run_experiment_single_node.sh \
#     ar/qwen3_omni_audio_video_gspo_lora_vllm_omni_1x8

defaults:
  - /_base/ar/qwen3_omni
  - _self_
num_devices: 8
devices_per_node: 8
batch_size: 8

eval_interval: 20
eval_num_prompts: -1
logging:
  run_name: qwen3_omni_daily_omni_av_gspo_lora_vllm_omni_1x8
  tags: [gspo, qwen3-omni, thinker, video, audio, audio-in-video, vllm-omni, lora, daily-omni, 1x8]

bundle:
  config:
    attn_implementation: flash_attention_2
    max_prompt_length: 16384
    video_fps: 2.0
    use_audio_in_video: true

pipeline:
  max_prompt_length: 16384
  video_fps: 2.0
  use_audio_in_video: true

backend:
  optimizer_cfg:
    learning_rate: 1.0e-5
rollout:
  config:
    max_prompt_length: 16384
    video_fps: 2.0
    video_max_pixels: 262144
    use_audio_in_video: true
reward:
  truncated_reward: keep
  overlong_buffer_len: 4096
  backend:
    config:
      graded_format_reward: false
      require_answer_phrase: true

algorithm:
  old_logp_source: replay
  clip_range: 1.0e-3
  clip_range_high: 1.33e-3
data_source:
  args:
    run:
      data_path: ${oc.env:DATA_PATH,datasets/daily_omni_av/train.jsonl}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,datasets/daily_omni_av/val.jsonl}
    algorithm:
      prompts_per_rollout: 8

sampling:
  max_new_tokens: 2048
