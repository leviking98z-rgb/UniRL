# @package _global_
# Qwen3-Omni Thinker · GSPO + LoRA · video MCQA · vLLM-Omni rollout · 4 GPU.
#
# 4-GPU single-replica sibling of qwen3_omni_video_r1_gspo_lora_vllm_omni_1x8.yaml.
# TP=4 (required — TP must divide the audio tower's 20 attention heads) uses all
# 4 GPUs for the rollout engine; training FSDP DP=4 time-shares the same cards via
# sleep/wake (enable_fsdp_offload). This adapter supports video-only MCQA;
# video audio-track conditioning is intentionally not exposed.
#
# Launch:
#   bash run_vllm_omni.sh video
# or:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 \
#   QWEN3_OMNI_PATH=/path/to/Qwen3-Omni-30B-A3B-Instruct \
#   DATA_PATH=/path/to/video_r1_clevrer_perceptiontest/train.jsonl \
#   EVAL_DATA_PATH=/path/to/video_r1_clevrer_perceptiontest/val.jsonl \
#   PYTHONPATH=$(pwd) \
#   python -m unirl.train_ar --config-name=ar/qwen3_omni_video_r1_gspo_lora_vllm_omni_1x4

defaults:
  - /_base/ar/qwen3_omni
  - _self_
num_devices: 4
devices_per_node: 4
batch_size: 4          # DP=4 -> 1 prompt/rank; x samples_per_prompt=8 = 8 seqs/rank

eval_interval: 10
eval_num_prompts: 100
logging:
  run_name: qwen3_omni_video_r1_gspo_lora_vllm_omni_1x4
  tags: [gspo, qwen3-omni, thinker, video, vllm-omni, lora, video-r1, 1x4]

bundle:
  config:
    attn_implementation: sdpa
    max_prompt_length: 16384
    video_fps: 1.0
pipeline:
  max_prompt_length: 16384
  video_fps: 1.0
backend:
  optimizer_cfg:
    learning_rate: 1.0e-5
reward:
  truncated_reward: keep
  overlong_buffer_len: 4096
  backend:
    # video_r1 mandates <answer>X</answer>; require_answer_tag is strict —
    # 1.0 only for a well-formed <answer>X</answer> matching gt, else 0.
    config:
      require_answer_tag: true

algorithm:
  clip_range: 1.0e-3
  clip_range_high: 2.0e-3
  old_logp_source: replay
data_source:
  args:
    run:
      data_path: ${oc.env:DATA_PATH,datasets/video_r1_clevrer_perceptiontest/train.jsonl}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,datasets/video_r1_clevrer_perceptiontest/val.jsonl}
    algorithm:
      prompts_per_rollout: 4   # must match batch_size

sampling:
  max_new_tokens: 2048
