# @package _global_
# ASYNC AR GRPO Qwen3-4B-Base on DAPO-Math — FP8 ROLLOUT variant.
#
# Identical to ar/qwen3_grpo_4b_base_dapo_sglang_async.yaml EXCEPT the SGLang
# rollout engine generates in FP8 (FP8 weights/activations) for a faster, lighter
# rollout slab, while training stays BF16. Two things change vs the bf16 async
# recipe:
#   * rollout.config.quantization: fp8          (the rollout engine; see below)
#   * rollout_drift_warn / rollout_drift_abort  (the FP8 safety valve)
# Everything else (model / data / sampling / advantage / loss / sync) is the same.
#
# WHY THIS IS SAFE: the policy being optimized is the BF16 train weights; the
# rollout engine is only the sampler. GRPO anchors the importance ratio on the
# engine's emitted logprobs (algorithm.old_logp_source defaults to 'rollout'), so
# r_t = pi_BF16 / mu_FP8 is an importance-sampling correction for the FP8<->BF16
# gap, not a silent bias. The drift guard refuses to train through a gap so large
# the IS ratio tail destabilizes. Full rationale + the MoE caveat + the Truncated
# Importance Sampling TODO live in docs/fp8_rollout.md.
#
# Run (example: 4 GPUs -> 2 train / 2 rollout):
#   DATA_PATH=data/dapo_math/train.jsonl EVAL_DATA_PATH=data/dapo_math/aime_eval.jsonl \
#   python -m unirl.train_async_ar --config-name=ar/qwen3_grpo_4b_base_dapo_sglang_async_fp8 \
#     num_devices=4 batch_size=8 sampling.samples_per_prompt=4

num_devices: 32
batch_size: 64 # prompts_per_rollout
num_rollouts: 800

train_fraction: 0.5

max_inflight: 1
buffer_max_staleness: 0

weight_sync_interval: 1

eval_interval: 10

adv_normalization_scope: group
normalize_adv_by_std: false

# FP8-rollout drift guard (off in the bf16 recipe; on here). Reads the AR
# algorithms' rollout_replay_logp_absdiff_mean each rollout: warn past 0.10 (the
# IS tail is widening), RuntimeError past 0.30 (too heavy to train through). On-
# policy bf16-vs-bf16 sits well under 0.05, so a sustained >0.1 mean already says
# the FP8 engine and the BF16 train forward disagree materially. Tune per model.
rollout_drift_warn: 0.10
rollout_drift_abort: 0.30

logging:
  report_to_wandb: true
  project_name: unirl-grpo
  run_name: grpo_qwen3-4b-base_dapo_sglang_async_fp8
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [grpo, qwen3, 4b-base, dapo, sglang, v2, async, fp8]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,Qwen/Qwen3-4B-Base}
    model_precision: fp32
    autocast_precision: bf16
    logprob_precision: fp32
    use_gradient_checkpointing: true

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: true
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.01
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000

rollout:
  # SGLang LLM engine, DISAGGREGATED, generating in FP8. tp_size=1 -> one single-
  # GPU engine per rollout GPU. The train slab and weight sync stay BF16 (dense
  # NCCL broadcast); only the SRT engine's load + compute precision is FP8.
  _target_: unirl.rollout.engine.sglang.engine.SGLangRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,Qwen/Qwen3-4B-Base}
    tp_size: 1
    # FP8 GENERATION (training stays BF16). Forwarded to ServerArgs.quantization.
    # Default None = native dtype; setting it here is the entire opt-in. An FP8 KV
    # cache (kv_cache_dtype: fp8_e5m2) is available but left off — it is a second,
    # independent precision drop; enable it only after the weight/activation FP8
    # run is stable on the drift guard.
    quantization: fp8
    max_new_tokens: 8192
    temperature: 1.0
    top_p: 1.0
    concurrency: 16
    samples_pre_expanded: true
    chat_template_kwargs:
      enable_thinking: true
    engine_kwargs:
      mem_fraction_static: 0.8
      skip_server_warmup: true
      attention_backend: triton
      disable_cuda_graph: false
      cuda_graph_max_bs: 16
      enable_lora: false

reward:
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.2
  clip_range_high: 0.28
  clip_schedule: constant
  loss_agg_mode: seq-mean-token-sum-norm
  horizon: 8192
  sampling_temperature: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  _target_: unirl.distributed.weight_sync.full.nccl.NCCLWeightSync
  group_name: weight_sync
  lora_merged: false
  bucket_size_mb: 512
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 4

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}
      seed: 42
    algorithm:
      prompts_per_rollout: 64 # 64 prompts x 8 samples = 512 / rollout

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 8192
