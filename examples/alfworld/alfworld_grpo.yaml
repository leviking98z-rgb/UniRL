# @package _global_
# ALFWorld — multi-turn agentic RL baseline. The mature benchmark that shows the
# agentic stack LEARNS on a genuine long-horizon tool/agent workload: the model issues
# a text command each turn, AlfworldEnv steps the simulator and returns the next
# observation, and the trajectory reward is the environment's terminal task-success
# (attached to the trajectory by AgenticRolloutEngine, read by AgenticEnvTrainer — NO
# reward backend is scored). Same trainer/engine as deep-research; only the env + the
# reward SOURCE differ.
#
# Prerequisites (on the pod):
#   - QWEN3_INSTRUCT_PATH : local Qwen3 checkpoint dir
#   - ALFWORLD_DATA       : ALFWorld data dir (after `alfworld-download`)
#   - DATA_PATH           : game-index jsonl (python -m unirl.data.prepare.alfworld --out-dir data/alfworld)
#   - ALFWORLD_CONFIG (optional): ALFWorld base_config.yaml (else the package default)
#
# Run (single node, whole 8-GPU node):
#   QWEN3_INSTRUCT_PATH=... ALFWORLD_DATA=... DATA_PATH=data/alfworld/train.jsonl \
#   python -m unirl.train_agentic_env --config-name=alfworld/alfworld_grpo num_devices=8

defaults:
  - /_base/agentic/alfworld
  - _self_
num_rollouts: 50
worker_max_concurrency: 8
logging:
  run_name: alfworld_grpo_qwen3
  tags: [alfworld, agentic, multi-turn, env-reward, grpo, qwen3]
rollout:
  # Multi-turn agentic engine driving a STATEFUL per-episode ALFWorld env. Each
  # trajectory is one episode; the env emits the terminal task-success as the reward.
  config:
    inner:
      engine_kwargs:
        mem_fraction_static: 0.3
sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  bucket_size_mb: 64
data_source:
  args:
    algorithm:
      prompts_per_rollout: 8 # == batch_size (P)
