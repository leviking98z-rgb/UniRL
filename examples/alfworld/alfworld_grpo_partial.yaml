# @package _global_
# LIN-531 — Colocate PARTIAL-ROLLOUT ALFWorld: AgenticEnvPartialTrainer, COLOCATE (train + rollout
# time-share each GPU, TensorWeightSync). The synchronous partial-rollout sibling of alfworld_grpo.yaml
# (barrier AgenticEnvTrainer). Over-samples ALFWorld episodes, commits the fastest `batch_size` complete
# GRPO groups, and `abort`s the slow tail at a turn boundary. `tail_policy: drop` because ALFWorld is a
# stateful-episode env (a carried partial restarts on reset) — dropping still cuts the 15-turn straggler
# while keeping ALL GPUs for generation. This is the sweet spot the disaggregated async trainer missed on
# ALFWorld (it halved the generation GPUs). Head-to-head vs alfworld_grpo.yaml (barrier) and
# alfworld_grpo_async.yaml (async) for the LIN-531 speed comparison.
#
# Run (single node, whole 8-GPU node):
#   QWEN3_INSTRUCT_PATH=... ALFWORLD_DATA=... DATA_PATH=data/alfworld/train.jsonl \
#   python -m unirl.train_agentic_env_partial --config-name=alfworld/alfworld_grpo_partial num_devices=8

defaults:
  - /_base/agentic/alfworld
  - _self_
num_rollouts: 30
oversample_batch_size: 12 # generate 12 games/drive; commit the fastest 8 → 4 slow games' tail aborted
buffer_max_staleness: 2 # a buffered group may cross up to 2 weight syncs before eviction
tail_policy: drop # ALFWorld reset starts a fresh episode → a carried partial restarts, so DROP it

# Colocate partial oversubscribes rank 0: its own run_drain + every worker's next_task pull +
# the poll→drain_completed fan + submit/abort/sync all ride these threaded-actor slots. Give it
# generous headroom (barrier only needs 8 because it never poll-fans).
worker_max_concurrency: 24
logging:
  run_name: alfworld_grpo_qwen3_partial
  tags: [alfworld, agentic, multi-turn, env-reward, grpo, qwen3, partial-rollout, colocate, drop, lin-531]
rollout:
  config:
    partial_rollout: true
    inner:
      engine_kwargs:
        mem_fraction_static: 0.3 # colocate: shares the GPU with the FSDP train shard (sleep/wake)
sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  bucket_size_mb: 64
data_source:
  args:
    algorithm:
      prompts_per_rollout: 12 # == oversample_batch_size (the per-drive game pool)
