# @package _global_
# Validation run: SD3.5-medium LoRA flow-matching SFT on naruto-blip-captions.
#
# Launch (1×8):
#   ENTRY=train_sft bash examples/run_experiment_single_node.sh sft/validation/sd3_sft_lora

defaults:
  - /_base/sft/validation
  - _self_
batch_size: 32
num_steps: 1500
eval_interval: 0
eval_batch_size: 16
eval_num_samples: -1
save_interval: 300
save_dir: ${oc.env:SFT_SAVE_DIR,checkpoints/sft_sd3}
transport_kind: colocate_store
workers_per_device: 1

logging:
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft-validation}
  run_name: ${oc.env:WANDB_RUN_NAME,sd3-lora-naruto}
  tags: [sft, sd3, diffusion, lora, validation]

bundle:
  _target_: unirl.models.sd3.bundle.SD3Bundle.from_config
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0

pipeline:
  _target_: unirl.models.sd3.pipeline.SD3Pipeline
  shift: 3.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  block_class_names: ["JointTransformerBlock"]
  fsdp_cfg:
    reshard_after_forward: false
    activation_checkpointing: false
  optimizer_cfg:
    weight_decay: 0.0
  scheduler_cfg:
    type: constant
    warmup_steps: 0
  lora_cfg:
    rank: 32
    alpha: 64
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

algorithm:
  _target_: unirl.algorithms.sft.FlowMatchSFT
  stage_attr: diffusion
  timestep_sampling: logit_normal
  timestep_shift: 3.0
  conditions_cls:
    path: unirl.models.sd3.conditions.SD3Conditions
  params: ${sampling}

stack:
  micro_batch_size: 4
track_builder:
  _target_: unirl.train.sft.track_builder.DiffusionSupervisedTrackBuilder
  height: 512
  width: 512
  guidance_scale: 1.0

data_source:
  manifest_path: ${oc.env:SFT_DATA}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,${oc.env:SFT_DATA}}
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
