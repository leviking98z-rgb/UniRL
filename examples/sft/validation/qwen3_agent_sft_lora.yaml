# @package _global_
# Qwen3-8B LoRA SFT on multi-turn tool-calling trajectories.
#
# Prepare:
#   python -m unirl.utils.prepare_sft_agent \
#     --out-dir datasets/sft_agent_toolcall_12k
#
# Launch (1x8):
#   ENTRY=train_sft bash examples/run_experiment_single_node.sh \
#     sft/validation/qwen3_agent_sft_lora

defaults:
  - /_base/sft/validation
  - _self_
batch_size: 64
num_steps: 600
eval_interval: 20
eval_batch_size: 16
eval_num_samples: 64
save_interval: 20
save_dir: ${oc.env:SFT_SAVE_DIR,checkpoints/sft_qwen3_agent}
logging:
  project_name: ${oc.env:WANDB_PROJECT,unirl-agent-sft}
  run_name: ${oc.env:WANDB_RUN_NAME,qwen3-8b-lora-toolcall}
  tags: [sft, agent, tool-call, qwen3, llm, lora]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,Qwen/Qwen3-8B}
    model_precision: bf16
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: true
  max_prompt_length: 8192
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  block_class_names: ["Qwen3DecoderLayer"]
  fsdp_cfg:
    reshard_after_forward: true
    activation_checkpointing: false
    master_dtype: fp32
  optimizer_cfg:
    weight_decay: 0.0
  scheduler_cfg:
    type: cosine
    warmup_steps: 20
  lora_cfg:
    rank: 32
    alpha: 64
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

algorithm:
  _target_: unirl.algorithms.sft.SFT
  stage_attr: ar
  loss_agg_mode: token-mean
  conditions_cls:
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

stack:
  micro_batch_size: 1
track_builder:
  _target_: unirl.train.sft.track_builder.ARSupervisedTrackBuilder
  max_response_length: 1024

data_source:
  manifest_path: ${oc.env:SFT_DATA,datasets/sft_agent_toolcall_12k/train.jsonl}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,datasets/sft_agent_toolcall_12k/val.jsonl}
