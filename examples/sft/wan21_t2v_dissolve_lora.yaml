# @package _global_
# WAN 2.1 T2V concept LoRA showcase: learn the 3DGS_DISSOLVE red-spark effect.
#
# Dataset:
#   hf download finetrainers/3dgs-dissolve --repo-type dataset \
#       --local-dir /path/to/3dgs-dissolve
#   python -m unirl.utils.prepare_sft_t2v_concept \
#       --data-root /path/to/3dgs-dissolve \
#       --out-dir data/sft_3dgs_dissolve \
#       --trigger-token 3DGS_DISSOLVE --val-count 8 --seed 42
#
# Train:
#   ENTRY=train_sft SFT_DATA=data/sft_3dgs_dissolve/train.jsonl \
#   SFT_EVAL_DATA=data/sft_3dgs_dissolve/val.jsonl \
#   bash examples/run_experiment_single_node.sh sft/wan21_t2v_dissolve_lora
#
# Generate matched base/LoRA videos from a checkpoint:
#   python -m unirl.tools.generate_wan21_lora_comparison \
#       --base "$PRETRAINED_MODEL" --checkpoint /path/to/best-checkpoint \
#       --output-dir outputs/wan21_dissolve_comparison
#
# ``eval/loss`` uses a fixed per-sample noise draw and is the checkpoint
# selection signal. ``train/loss_ema_50`` exposes the noisy train-loss trend.

num_devices: 8
batch_size: 8
num_steps: 2000
eval_interval: 50
eval_batch_size: 8
eval_num_samples: -1
save_interval: 200
save_dir: ${oc.env:OUTPUT_DIR,outputs/wan21_t2v_dissolve_lora}
save_mode: adapter
transport_kind: colocate_store
workers_per_device: 1

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft}
  run_name: ${oc.env:WANDB_RUN_NAME,wan21_t2v_dissolve_lora}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [sft, wan21, t2v, video, lora, concept, 3dgs-dissolve]

bundle:
  _target_: unirl.models.wan21.bundle.WAN21Bundle.from_config
  config:
    _target_: unirl.models.wan21.config.WAN21PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512
    load_vae: true

pipeline:
  _target_: unirl.models.wan21.pipeline.WAN21Pipeline
  shift: 5.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  max_sequence_length: 512
  video_encode:
    num_frames: 49
    height: 480
    width: 832
    # The bounded decoder samples across the full clip, so retaining exactly
    # the 49 VAE input frames avoids buffering hundreds of 1080p frames.
    max_decode_frames: 49
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["WanTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.99
    adam_epsilon: 1.0e-8
    weight_decay: 1.0e-4
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: linear_warmup
    warmup_steps: 100
    total_steps: ${num_steps}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 32
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0

algorithm:
  _target_: unirl.algorithms.sft.FlowMatchSFT
  stage_attr: diffusion
  timestep_sampling: logit_normal
  timestep_shift: 5.0
  eval_seed: 42
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.wan21.conditions.WAN21Conditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0

track_builder:
  _target_: unirl.train.sft.track_builder.VideoDiffusionSupervisedTrackBuilder
  guidance_scale: 1.0

data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:SFT_DATA}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA}
  seed: 42

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 50
  # FlowMatchSFT reads this value directly: training is the pure conditional
  # branch. The comparison tool independently defaults inference CFG to 5.0.
  guidance_scale: 1.0
  height: 480
  width: 832
  num_frames: 49
  eta: 0.0
  seed: 42
