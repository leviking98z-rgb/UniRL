# @package _global_
# MixGRPO WAN 2.1 T2V trainside (FSDP) colocate, v2 trainer, 1x8.
# Derived from wan21_t2v.yaml; canonical MixGRPO recipe is sd3_mixgrpo.yaml.
#
# MixGRPO = FlowGRPO + Flow SDE + a progressive sliding-window SDE-index
# scheduler. The ONLY differences from wan21_t2v are the scheduler
# (AllSDEScheduler -> WindowScheduler, strategy=progressive) and init_same_noise.
# The SDE kernel stays FlowSDEStrategy. Video shape (720p / 5 frames), 3D VAE,
# UMT5, video_pickscore are unchanged.
#
# LoRA targets are the WAN attention modules (attn1/attn2.to_*); v1's generic
# q_proj default matched nothing. Verify on first GPU smoke that
# `[n for n,p in model.named_parameters() if p.requires_grad]` is non-empty.

defaults:
  - /_base/diffusion/wan21
  - _self_
num_devices: 8                # 1 node x 8 GPUs
batch_size: 48                # prompts_per_rollout
num_rollouts: 1000

bundle:
  config:
    _target_: unirl.models.wan21.config.WAN21PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  fsdp_cfg:
    activation_checkpointing: false  # deliberately off (speed); v1 used bf16_full_ac
  optimizer_cfg:
    learning_rate: 3.0e-4
  scheduler_cfg:
    total_steps: 1000               # v1 constant_1k
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    # WAN transformer attention (self attn1 + cross attn2). v1's generic
    # q_proj/k_proj default matched nothing here.
    target_modules:
      - attn1.to_q
      - attn1.to_k
      - attn1.to_v
      - attn1.to_out.0
      - attn2.to_q
      - attn2.to_k
      - attn2.to_v
      - attn2.to_out.0

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 4           # v1 rollout.plan.forward_batch_size (720p caps activation)

algorithm:
  old_logp_source: replay
data_source:
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
sampling:
  num_inference_steps: 14         # wan21_720p preset
  height: 720
  width: 1280
  num_frames: 5                   # wan21_720p preset; (num_frames-1)%4==0 required
  samples_per_prompt: 16
  init_same_noise: true            # MixGRPO shares the initial noise across the group
  # Progressive sliding-window SDE-index schedule (MixGRPO). The window of
  # SDE-recorded steps advances with the rollout id; rolls back to the start
  # once it sweeps the schedule.
  scheduler:
    _target_: unirl.utils.scheduler_utils.WindowScheduler
    config:
      _target_: unirl.utils.scheduler_utils.WindowConfig
      strategy: progressive
      window_size: 4
      iters_per_window: 25
      init_timestep: 0
      overlap_size: 1
      roll_back: true
      max_iters_per_window: 10
      min_iters_per_window: 1

logging:
  project_name: ${oc.env:WANDB_PROJECT,unirl-grpo-t2v}
  run_name: ${oc.env:WANDB_RUN_NAME,wan21_t2v_mixgrpo}
  tags: ["wan21", "t2v", "mixgrpo", "grpo", "video", "pickscore", "v2"]
  media_max_items: 8
  media_log_interval: 1
