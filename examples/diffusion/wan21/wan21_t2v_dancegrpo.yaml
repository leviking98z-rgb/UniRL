# @package _global_
# DanceGRPO WAN 2.1 T2V trainside (FSDP) colocate, v2 trainer, 1x8.
# Derived from wan21_t2v.yaml; canonical DanceGRPO recipe is sd3_dancegrpo.yaml.
#
# DanceGRPO = FlowGRPO + the Dance SDE kernel. The ONLY difference from
# wan21_t2v is the SDE kernel:
#   pipeline.strategy : FlowSDEStrategy -> DanceSDEStrategy
# The step schedule (sampling.scheduler) is inherited unchanged from the base —
# mirrors how sd3_dancegrpo == sd3_trainside scheduler + Dance kernel.
# Video shape (720p / 5 frames), 3D VAE, UMT5, video_pickscore are unchanged.
#
# LoRA targets are the WAN attention modules (attn1/attn2.to_*); v1's generic
# q_proj default matched nothing. Verify on first GPU smoke that
# `[n for n,p in model.named_parameters() if p.requires_grad]` is non-empty.

defaults:
  - /_base/diffusion/wan21
  - _self_
num_devices: 8                # 1 node x 8 GPUs
batch_size: 48                # prompts_per_rollout
num_rollouts: 1000

bundle:
  config:
    _target_: unirl.models.wan21.config.WAN21PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512

pipeline:
  strategy:
    _target_: unirl.sde.kernels.DanceSDEStrategy

backend:
  fsdp_cfg:
    activation_checkpointing: false  # deliberately off (speed); v1 used bf16_full_ac
  optimizer_cfg:
    learning_rate: 3.0e-4
  scheduler_cfg:
    total_steps: 1000               # v1 constant_1k
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    # WAN transformer attention (self attn1 + cross attn2). v1's generic
    # q_proj/k_proj default matched nothing here.
    target_modules:
      - attn1.to_q
      - attn1.to_k
      - attn1.to_v
      - attn1.to_out.0
      - attn2.to_q
      - attn2.to_k
      - attn2.to_v
      - attn2.to_out.0

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 4           # v1 rollout.plan.forward_batch_size (720p caps activation)

algorithm:
  old_logp_source: replay
data_source:
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
sampling:
  num_inference_steps: 14         # wan21_720p preset
  height: 720
  width: 1280
  num_frames: 5                   # wan21_720p preset; (num_frames-1)%4==0 required
  samples_per_prompt: 16
  init_same_noise: false
  # SDE step schedule inherited verbatim from wan21_t2v (DanceGRPO swaps only
  # the kernel, not the schedule).
  scheduler:
    _target_: unirl.sde.scheduler.AllSDEScheduler
    timestep_fraction: [0.0, 0.5]   # all steps in first half (num_sde_steps null)
    num_sde_steps:

logging:
  project_name: ${oc.env:WANDB_PROJECT,unirl-grpo-t2v}
  run_name: ${oc.env:WANDB_RUN_NAME,wan21_t2v_dancegrpo}
  tags: ["wan21", "t2v", "dancegrpo", "grpo", "video", "pickscore", "v2"]
  media_max_items: 8
  media_log_interval: 1
