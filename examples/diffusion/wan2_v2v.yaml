# @package _global_
# Compatibility entry for the historical WAN 2.2 V2V trainside profile.
#
# Prefer `diffusion/wan22_v2v/wan22_v2v_14b` for new runs. This public name is
# retained for one release with its original 50% SDE window and logging tags.
# {"prompt": "make the motion cinematic", "media": [{"modality": "video", "role": "condition", "uri": "/path/in.mp4"}]}

defaults:
  - /diffusion/wan22_v2v/_base/v2v_14b
  - _self_

sampling:
  scheduler:
    timestep_fraction: [0.0, 0.5]

logging:
  tags: ["wan22", "wan2", "v2v", "grpo", "video", "pickscore", "trainside"]
