# @package _global_
# SD3 v2 trainer — LoRA training, LoRA-ADAPTER sync via Ray RPC (SEPARATE slabs).
# LoRA twin of sd3_vllmomni_full_nccl_separate.yaml: identical train side + rollout,
# the only swap is the sync handler.
#   - layout: separate — train on `train_fraction` of the pool, rollout on the rest.
#   - LoRA training (lora_cfg kept), pushed as the bare ADAPTER each sync
#     (RemoteLoraWeightSync ships lora_A/lora_B to the engine's set_lora_from_tensors).
#   - No NCCL group / merged-model broadcast: rank 0 ships the few-MB adapter over a
#     plain Ray RPC to each rollout Worker. The vLLM-Omni sd35_t2i stage config
#     enables LoRA (enable_lora: true, max_lora_rank: 32), so the engine accepts it.

defaults:
  - /_base/diffusion/sd3
  - _self_
num_devices: 8
batch_size: 48 # prompts_per_rollout
layout: separate
train_fraction: 0.5 # 4 train GPUs + 4 rollout GPUs on an 8-GPU pool.

weight_sync_interval: 1

bundle:
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0
    load_vae: false

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  optimizer_cfg:
    weight_decay: 0.0
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    # sd35_t2i stage config enables LoRA (enable_lora: true, max_lora_rank: 32),
    # so the engine accepts the adapter pushed by RemoteLoraWeightSync.
    modality: sd3_t2i
    # Separate slabs do not time-share GPUs, so sleep/wake is unnecessary.
    enable_sleep_mode: false

reward:
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  clip_range: 1.0e-4
  clip_schedule: constant
stack:
  micro_batch_size: 1
  num_updates_per_batch: 2      # PPO mini-batches per rollout (π_old frozen once); v1 parity

sampling:
  eta: 0.7
  init_same_noise: false
  scheduler:
    _target_: unirl.sde.scheduler.AllSDEScheduler
    num_sde_steps: 3
    # SDE-step window: [0,0.5] confines SDE noise to the early high-σ steps
    # (the validated reproduce setting); [0,1] spreads it across all steps.
    timestep_fraction: [0, 0.5]

# LoRA adapter sync → vLLM-Omni rollout (separate-slab Ray RPC). Wired to the
# rollout slab by DiffusionTrainer's one-time handshake (set_rollout_targets only —
# no NCCL pick_master/connect). RemoteLoraWeightSync takes the backend sibling
# only (rollout is cross-slab); rank 0 ships the adapter to each rollout Worker.
sync:
  _target_: unirl.distributed.weight_sync.lora.RemoteLoraWeightSync
  # vLLM-Omni supports the loaded_lora_checksums read-back; verify asserts the
  # synced adapter landed bit-exactly each sync. Set false once trusted.
  verify: true
  # Mirrors SD3PipelineConfig.weight_sync_param_name_prefix; must match the
  # engine-side LoRA key naming (a wrong prefix yields wrong/zero loaded layers,
  # which `verify` catches).
  param_prefix: "transformer."
  adapter_name: default
