# @package _global_
# SD3.5 + DiffusionNFT trainside (FSDP) colocate, v2 trainer, 1x8 H20.
#
# DiffusionNFT = forward-process diffusion RL with a dual-adapter EMA reference:
#   - backend.ema_lora_cfg installs "default" (trainable) + "old" (EMA) LoRA
#     adapters via inject_nft; the trainer samples under "old", trains
#     "default", then EMA-updates "old" at each rollout boundary.
#   - algorithm._target_ = DiffusionNFT (pulls the EMA handle off backend.ema,
#     which the trainer injects via backend=...).
#   - sampling.scheduler.num_sde_steps: 0 — KEY: forward-process path, no
#     per-step SDE log_prob recorded (Euler ODE rollout, clean final latents).
#
# Faithful to v1 nft_sd3 (vs the GRPO sd3_trainside.yaml): activation
# checkpointing ON (bf16_full_ac), weight_decay 1e-4 (adam_3e-4_wd1e-4),
# micro_batch_size 8, forward_batch_size 32, eta 0.0.

defaults:
  - /_base/diffusion/sd3
  - _self_
num_devices: 8
batch_size: 48                # prompts_per_rollout
num_rollouts: 10000

bundle:
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  optimizer_cfg:
    weight_decay: 1.0e-4             # v1 nft_sd3 uses adam_3e-4_wd1e-4
  ema_lora_cfg:
    _target_: unirl.train.configs.EmaLoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    shadow_adapter: old
    ema_decay: 0.001
    ema_decay_type: warmup
    ema_flat_steps: 0
    ema_uprate: 0.001
    ema_uphold: 0.5
    timing: rollout_end
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  # v1 rollout.plan.forward_batch_size default (FBS env, 32). 512²/10-step
  # SD3.5 sampling on an H20 96GB safely accommodates 32.
  forward_batch_size: 32

reward:
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.diffusionnft.DiffusionNFT
  beta: 1.0
  adv_clip_max: 5.0
  adv_mode: raw
  use_adaptive_weight: true
  train_timestep_mode: all
  shuffle_train_timesteps: true
  apply_time_shift_in_loss: false
  training_timestep_fraction: 0.99
  kl_coef: 0.0

stack:
  micro_batch_size: 8           # v1 nft_sd3 training.plan.micro_batch_size
sampling:
  eta: 0.0                      # DiffusionNFT: forward-process, no SDE noise injection
  init_same_noise: false
  scheduler:
    _target_: unirl.sde.scheduler.AllSDEScheduler
    num_sde_steps: 0            # DiffusionNFT forward-process: no SDE steps recorded

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-diffusionNFT}
  run_name: ${oc.env:WANDB_RUN_NAME,sd3_nft}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: ["sd3.5", "nft", "pickscore", "trainside", "v2"]
  log_media: true
  media_max_items: 8
  media_log_interval: 1
