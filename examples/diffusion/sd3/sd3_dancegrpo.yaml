# @package _global_
# DanceGRPO-Fast SD3.5 trainside (FSDP) colocate, v2 trainer, 2x8.
#
# DanceGRPO = FlowGRPO + the Dance SDE kernel. The ONLY algorithmic
# difference from sd3_trainside (FlowGRPO) is pipeline.strategy:
#   FlowSDEStrategy -> DanceSDEStrategy.
# SDE indices are sparse over the first half of the schedule
# (timestep_fraction [0.0, 0.5], num_sde_steps 3), matching v1.
#
# Faithful to v1 base flowgrpo_fast_sd3_trainside: activation_checkpointing OFF
# (bf16_full_noac), forward_batch_size 8, micro_batch_size 8.
# num_updates_per_batch=2 restored (v2 TrainStack multi-update). Not carried over
# (v2 minimal trainer): the full-model eval EMA (decay 0.99).

defaults:
  - /_base/diffusion/sd3
  - _self_
num_devices: 16               # 2 nodes x 8 GPUs (v1 actor_count 16)
batch_size: 48                # prompts_per_rollout
num_rollouts: 10000

bundle:
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0

pipeline:
  strategy:
    _target_: unirl.sde.kernels.DanceSDEStrategy

backend:
  optimizer_cfg:
    weight_decay: 0.0
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 8            # v1 flowgrpo_fast_sd3_trainside

reward:
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  clip_range: 1.0e-4
  clip_schedule: constant
  old_logp_source: replay
stack:
  micro_batch_size: 8
  num_updates_per_batch: 2      # PPO mini-batches per rollout (π_old frozen once); v1 parity

sampling:
  eta: 0.7
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    timestep_fraction: [0.0, 0.5]   # SDE steps drawn from the first half (v1)
    num_sde_steps: 3

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-dancegrpo}
  run_name: ${oc.env:WANDB_RUN_NAME,sd3_dancegrpo}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: ["sd3.5", "dancegrpo", "grpo", "trainside", "v2"]
  log_media: true
  media_max_items: 8
  media_log_interval: 1
