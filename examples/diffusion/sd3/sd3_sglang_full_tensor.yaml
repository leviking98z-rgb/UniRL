# @package _global_
# SD3 v2 trainer — LoRA training, MERGED full-weight sync via tensor-payload (COLOCATE).
# SGLang twin of sd3_vllmomni_full_tensor.yaml: identical train side + sync, the
# only swap is the rollout engine (SGLangDiffusionRolloutEngine instead of vLLM-Omni).
#   - LoRA training (lora_cfg kept), pushed as a MERGED full model each sync —
#     sync.lora_merged: true folds the LoRA delta into the base weights, so the
#     rollout engine runs the merged model with no separate adapter.
#   - sync -> TensorWeightSync (colocate serialized-tensor handoff), driving
#     SGLang's update_weights_from_tensor (load_format="flattened_bucket").

defaults:
  - /_base/diffusion/sd3
  - _self_
num_devices: 8
# prompts_per_rollout. Reduced from 48 (the vLLM-Omni configs' value) for SGLang
# colocate: the resident train shard (~17 GB) shares each H20 with the engine
# (~59 GB incl. its memory-saver pool), so the per-engine DiT-forward activation
# must stay small. 16 prompts × 16 samples / 8 engines = 32 imgs/engine (~8 GB).
batch_size: 16
weight_sync_interval: 1

bundle:
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0
    load_vae: false

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  optimizer_cfg:
    weight_decay: 0.0
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.sglang_diffusion.engine.SGLangDiffusionRolloutEngine
  # model_config carries the σ-schedule `shift` + checkpoint path; share the
  # bundle's config (the worker materializes the nested _target_).
  model_config: ${bundle.config}
  # SDE strategy → engine resolves the SGLang kernel label (sde_label) needed by
  # _to_sglang_kwargs. Colocate doesn't inject `strategy` via setup(), so pass
  # the pipeline's strategy explicitly (vLLM-Omni doesn't need it; SGLang does).
  strategy: ${pipeline.strategy}
  config:
    _target_: unirl.rollout.engine.sglang_diffusion.config.SGLangDiffusionEngineConfig
    # Explicit family for trainer-side typed-condition reconstruction.
    model_family: sd3
    tp_size: 1
    populate_conditions: true
    init_same_noise: ${sampling.init_same_noise}
    # Chunk generate into 16-sample sub-batches so sglang bounds its DiT-forward
    # / VAE-decode peak memory (it runs the whole batch in one forward otherwise),
    # without shrinking the logical batch. Mirrors sd3_trainside.
    forward_batch_size: 16
    engine_kwargs:
      model_type: sd3
    # SGLang colocate time-shares the GPU via release_memory_occupation /
    # resume_memory_occupation (engine.sleep()/wake_up()); no sleep-mode knob.
    # NOTE: SGLang enables torch_memory_saver, which forces all CPU-offload flags
    # off, and its memory pool reabsorbs any freed space — so the DiT-forward
    # activation is bounded by forward_batch_size (above). batch_size is reduced
    # (top of file) so train shard + engine + activation fit on one H20.

reward:
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  clip_range: 1.0e-4
  clip_schedule: constant
  # Trainer-side replay recomputes the π_old anchor (matches prior behaviour).
  old_logp_source: replay
stack:
  micro_batch_size: 1
  num_updates_per_batch: 2      # PPO mini-batches per rollout (π_old frozen once); v1 parity

sampling:
  eta: 0.7
  init_same_noise: false
  autocast_precision: bf16
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_sde_steps: 3
    # SDE-step window: [0,0.5] confines SDE noise to the early high-σ steps
    # (the validated reproduce setting); [0,1] spreads it across all steps.
    timestep_fraction: [0, 0.5]

# LoRA → merged full-weight sync → SGLang rollout (colocate tensor-payload).
sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  # Fold the trained LoRA delta into the base weights and push the merged full
  # model (we LoRA-train but serve a merged model — no separate adapter).
  lora_merged: true
  bucket_size_mb: 512
  flush_cache: true
  # Ordered first-match-wins name rewrite (see FullWeightSync._apply_name_remap):
  # backend.model is the bare SD3 transformer (merged_state_dict yields
  # transformer_blocks.* etc.), so the "*" catch-all nests every key under the
  # receiver's transformer.* namespace. Applied on both the merged
  # (lora_merged=true) and raw paths.
  name_remap: {"*": "transformer.*"}
