# @package _global_
# FlowGRPO-Fast SD3 colocate reproduce — TransferQueue + Mooncake variant.
#
# Identical to conf/sd3_trainside.yaml except the transport plane: it runs the
# GLOBAL TransferQueue backend over Mooncake (zero-copy RDMA) instead of the
# in-process colocate_store. Use as the end-to-end example for TQ + mooncake.
#
# Prerequisites (mooncake): an external `mooncake_master` must already be running
# on the head node, and HEAD_IP must be exported (ports optional, defaulted
# below). The per-rollout zero-copy buffer reclaim (DevicePool.reset_transfer_queue_buffers)
# keeps the small PUT_TENSOR buffer from exhausting across rollouts, so the
# default (small) buffer sizes below are sufficient.
#
# Run: python -m unirl.train_diffusion --config-name diffusion/sd3/sd3_trainside_tq_mooncake

defaults:
  - /_base/diffusion/sd3
  - _self_
num_devices: 8
batch_size: 48 # prompts_per_rollout
transport_kind: transfer_queue
workers_per_device: 1
transfer_queue:
  _target_: unirl.distributed.tensor.backend.transfer_queue.mooncake.MooncakeBackend
  # External mooncake_master endpoints: HTTP metadata + RPC. HEAD_IP is required;
  # the ports default to mooncake_master's defaults when unset.
  metadata_server: http://${oc.env:HEAD_IP}:${oc.env:TQ_MC_METADATA_SERVER_PORT,50041}/metadata
  master_server_address: ${oc.env:HEAD_IP}:${oc.env:TQ_MC_RPC_PORT,50051}
  protocol: rdma # 'rdma' (default) or 'tcp'
  global_segment_size_gb: 64
  local_buffer_size_gb: 10
  client_name: MooncakeStorageClient
  # null → auto-discover HCAs per process (topology.list_rdma_bonds + PIX affinity).
  # Override only for ops debugging: transfer_queue.device_name=mlx5_bond_0.
  device_name:
  zero_copy:
    _target_: unirl.distributed.tensor.backend.transfer_queue.mooncake.MooncakeZeroCopyConfig
    enable: true
    # Small per-rollout buffers; the per-rollout reclaim frees them between
    # rollouts so they don't need to be sized for a whole run.
    tensor_buffer_size_gb: 2.0
    bytes_buffer_size_gb: 2.0
    # Controller/driver-only client buffer sizes (specialize_for_controller).
    single_controller_tensor_buffer_size_gb: 10.0
    single_controller_bytes_buffer_size_gb: 10.0

# Hardware-free alternative (in-Ray, no RDMA / no mooncake_master): comment out the
# mooncake `transfer_queue:` block above and use SimpleBackend instead.
# transfer_queue:
#   _target_: unirl.distributed.tensor.backend.transfer_queue.simple.SimpleBackend
#   num_units: 64
#   unit_size: 16384

logging:
  report_to_wandb: false # flip to true to enable wandb (rank-0/driver only)
  project_name: unirl
  run_name:
  entity:
  tags:

bundle:
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  optimizer_cfg:
    weight_decay: 0.0
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  # SD3 VAE decode on 96 fp32 latents at once (batch_size=48 × samples_per_prompt=16
  # / 8 devices) peaks ~24 GB on an H20 and OOMs alongside the resident text
  # encoders. Chunk forward into 16-sample groups (= samples_per_prompt so groups
  # never straddle a chunk boundary, matters once init_same_noise flips on).
  forward_batch_size: 16

reward:
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  clip_range: 1.0e-4
  clip_schedule: constant
  old_logp_source: replay
stack:
  micro_batch_size: 1
  num_updates_per_batch: 2 # PPO mini-batches per rollout (π_old frozen once); v1 parity

sampling:
  eta: 0.7
  init_same_noise: false
  # SDE step schedule: which denoising steps record SDE log-probs.
  # num_sde_steps: null = all steps; int = sparse subset; 0 = none (DiffusionNFT).
  # A static `sde_indices: [...]` overrides this. (WindowScheduler also available.)
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_sde_steps: 3
    # SDE-step window: [0,0.5] confines SDE noise to the early high-σ steps
    # (the validated reproduce setting); [0,1] spreads it across all steps.
    timestep_fraction: [0, 0.5]
