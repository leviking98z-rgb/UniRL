# @package _global_
# HunyuanVideo-1.5 T2V GRPO — v2 trainer, vllm-omni rollout, SEPARATE slabs.
#
# This is the v2 port, adapted to the flat conf_v2 schema and main's
# full-weight NCCL sync.
#
# Stack:
#   - Layout: separate slabs (train_fraction split).
#     train half — FSDPBackend (HunyuanVideo15TransformerBlock wrap)
#     rollout half — vllm-omni "t2v" modality (single DiT stage)
#   - LoRA r64 trained, MERGED full-weight pushed to rollout via NCCL
#     broadcast (sync.use_merged: true folds the LoRA delta into base).
#   - DanceGRPO-aligned hyperparameters: steps=16, cfg=0, eta=0.25,
#     shift=5.0, lr=1e-5, weight_decay=1e-4.
# Layout: 2 nodes × 8 GPUs, 8 train + 8 rollout (train_fraction=0.5).
#
# Why nccl_broadcast (not ipc_bucketed): the v1 ipc_bucketed sync deadlocked
# 4h post-Train_done on the first GRPO step (separate, 2x8 H20). Switching
# to nccl_broadcast cleared the hang. See feat-branch commit 0ec7774 +
# notes for details.
#
# Launch (2 nodes x 8 GPUs, taiji SPMD):
#   bash examples/run_experiment_multinode_taiji.sh diffusion/hunyuan_video15/hunyuan_video15_t2v_vllmomni_nccl_separate

defaults:
  - /_base/diffusion/hunyuan_video15
  - _self_
num_devices: 16                    # 2 nodes × 8 GPUs
batch_size: 16                     # prompts_per_rollout
layout: separate
train_fraction: 0.5                # 8 train + 8 rollout

weight_sync_interval: 1            # sync every rollout

logging:
  run_name: hunyuan_video15_t2v_vllmomni_nccl_separate
  tags: [hunyuan_video15, t2v, grpo, vllm-omni, separate, nccl, lora-r64, v2]

bundle:
  config:
    load_vae: false

rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${oc.env:PRETRAINED_MODEL,hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_t2v}
    modality: hv15_t2v
    # Separate slabs do not time-share GPUs, so sleep/wake is unnecessary.
    enable_sleep_mode: false
    # HV1.5 has ~30GB DiT shards on cephfs; checkpoint load alone takes
    # ~28 min, which barely overruns the engine.py default
    # init_timeout=1800. Bump to 1 hour for headroom.
    omni_extra:
      init_timeout: 3600
      stage_init_timeout: 1800

algorithm:
  old_logp_source: replay
sampling:
  samples_per_prompt: 16
sync:
  _target_: unirl.distributed.weight_sync.full.nccl.NCCLWeightSync
  use_merged: true
  group_name: weight_sync
  bucket_size_mb: 512
  flush_cache: true
  target_modules: ["transformer"]
  param_name_prefix: "transformer."
