# @package _global_
# GRPO WAN 2.2 T2V 14B trainside (FSDP) colocate, v2 trainer, 1x8.
#
# WAN 2.2 uses a dual WanTransformer3DModel (high_noise / low_noise) under a
# WanDualTransformer composite, routed by `boundary_ratio`. FSDP wraps each
# WanTransformerBlock in both branches; peft's LoRA name-suffix match hits both.
# Verify on first GPU smoke that trainable LoRA params appear under BOTH
# `high_noise.` and `low_noise.` prefixes.
#
# LoRA targets: WAN attn names (v1's generic q_proj default matched nothing).
# Data: DefaultDataSource (built-in prompts) for out-of-box runs.
# num_updates_per_batch=2 restored (v2 TrainStack multi-update).

defaults:
  - /_base/diffusion/wan22
  - _self_
batch_size: 48                # prompts_per_rollout
bundle:
  config:
    _target_: unirl.models.wan22.config.WAN22PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-T2V-A14B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512
    boundary_ratio: 0.875
    num_train_timesteps: 1000

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  fsdp_cfg:
    cpu_offload: false
    activation_checkpointing: false  # deliberately off (speed); v1 used bf16_full_ac
rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 1           # v1 (dual 14B transformer, heavy)

data_source:
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
sampling:
  num_inference_steps: 20
  width: 640
  num_frames: 1
  samples_per_prompt: 16
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    timestep_fraction: [0.0, 0.2]   # v1 algorithm.scheduler
    num_sde_steps:

logging:
  project_name: ${oc.env:WANDB_PROJECT,unirl-grpo-t2v}
  run_name: ${oc.env:WANDB_RUN_NAME,wan22_t2v}
  tags: ["wan22", "t2v", "grpo", "video", "pickscore", "dual-transformer", "v2"]
  media_max_items: 8
  media_log_interval: 1
