# @package _global_
# MixGRPO WAN 2.2 T2V 14B trainside (FSDP) colocate, v2 trainer, 1x8.
# Derived from wan22_t2v_14b.yaml; canonical MixGRPO recipe is sd3_mixgrpo.yaml.
#
# MixGRPO = FlowGRPO + Flow SDE + a progressive sliding-window SDE-index
# scheduler. The ONLY differences from wan22_t2v_14b are the scheduler
# (AllSDEScheduler -> WindowScheduler, strategy=progressive) and init_same_noise.
# The SDE kernel stays FlowSDEStrategy.
#
# WAN 2.2 uses a dual WanTransformer3DModel (high_noise / low_noise) routed by
# `boundary_ratio`; peft's LoRA name-suffix match hits both branches. Verify on
# first GPU smoke that trainable LoRA params appear under BOTH `high_noise.` and
# `low_noise.` prefixes.

defaults:
  - /_base/diffusion/wan22
  - _self_
batch_size: 48                # prompts_per_rollout
bundle:
  config:
    _target_: unirl.models.wan22.config.WAN22PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-T2V-A14B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512
    boundary_ratio: 0.875
    num_train_timesteps: 1000

pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  fsdp_cfg:
    cpu_offload: false
    activation_checkpointing: false  # deliberately off (speed); v1 used bf16_full_ac
rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 1           # v1 (dual 14B transformer, heavy)

data_source:
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
sampling:
  num_inference_steps: 20
  width: 640
  num_frames: 1
  samples_per_prompt: 16
  init_same_noise: true            # MixGRPO shares the initial noise across the group
  # Progressive sliding-window SDE-index schedule (MixGRPO). The window of
  # SDE-recorded steps advances with the rollout id; rolls back to the start
  # once it sweeps the schedule.
  scheduler:
    _target_: unirl.sde.scheduler.WindowScheduler
    config:
      _target_: unirl.sde.scheduler.WindowConfig
      strategy: progressive
      window_size: 4
      iters_per_window: 25
      init_timestep: 0
      overlap_size: 1
      roll_back: true
      max_iters_per_window: 10
      min_iters_per_window: 1

logging:
  project_name: ${oc.env:WANDB_PROJECT,unirl-grpo-t2v}
  run_name: ${oc.env:WANDB_RUN_NAME,wan22_t2v_mixgrpo}
  tags: ["wan22", "t2v", "mixgrpo", "grpo", "video", "pickscore", "dual-transformer", "v2"]
  media_max_items: 8
  media_log_interval: 1
