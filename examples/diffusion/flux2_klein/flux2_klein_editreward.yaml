# @package _global_
# FLUX.2-klein-9B GRPO — trainside + RemoteRewardBackend (EditReward).
#
# 2-node deployment:
#   Node 1: EditReward service (unirl-reward-service, 1 GPU for 7B VLM scorer)
#   Node 2: Flux2 Klein 9B training (8 GPU FSDP + LoRA, trainside rollout)
#
# Based on flux2_klein_trainside.yaml with:
#   - data_source → editreward dataset (editing prompts + condition images)
#   - reward → RemoteRewardBackend (HTTP to EditReward service on Node 1)
#
# Launch:
#   Node 1 (reward):
#     cd unirl-reward-service
#     ray start --head --port=6379 --num-gpus=1
#     python -m reward_service --config configs/editreward_service.yaml
#
#   Node 2 (train):
#     export REWARD_SERVICE_URL=http://<node1_ip>:8080
#     export NUM_NODES=1
#     export GPUS_PER_NODE=8
#     bash examples/run_experiment_multinode_taiji.sh diffusion/flux2_klein/flux2_klein_editreward

defaults:
  - /_base/diffusion/flux2_klein
  - _self_
batch_size: 48                # prompts_per_rollout (48 x 16 samples = 768 global)
logging:
  report_to_wandb: true
  project_name: ${oc.env:WANDB_PROJECT,unirl-flux2klein-editreward}
  run_name:
  entity: ${oc.env:WANDB_ENTITY,null}
  tags:
  log_media: true
  media_max_items: 8
  media_log_interval: 1

bundle:
  config:
    _target_: unirl.models.flux2_klein.config.Flux2KleinPipelineConfig
    pretrained_model_ckpt_path: ${oc.env:FLUX2_KLEIN_PATH,black-forest-labs/FLUX.2-klein-base-9B}
    model_precision: bf16
    max_sequence_length: 512
    shift: 1.0

pipeline:
  strategy:
    _target_: unirl.sde.kernels.DanceSDEStrategy

backend:
  fsdp_cfg:
    param_dtype: fp32
    activation_checkpointing: false
rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 16

# Remote EditReward service (Node 1). The 2-turn history (source + generated)
# is automatically built by RemoteRewardBackend when primitives["image"] exists.
reward:
  backend:
    _target_: unirl.reward.remote.RemoteRewardBackend
    base_device: cpu
    config:
      _target_: unirl.reward.remote.RemoteRewardSpec
      base_url: ${oc.env:REWARD_SERVICE_URL,http://localhost:8080}
      required_rewards: [editreward]
      reward_weights:
        editreward: 1.0
      timeout: 300.0
      sub_metric_reduce: mean
      aggregation_method: weighted_sum

data_source:
  args:
    run:
      data_path: datasets/image_edit/train.jsonl
      eval_data_path: datasets/image_edit/test.jsonl
sampling:
  init_same_noise: true
