# @package _global_
# HunyuanVideo-1.0 T2V GRPO — SGLang rollout with LoRA-merged weight sync.
#
# This is the SGLang counterpart of ``hunyuan_video_t2v_trainside``. Its
# optimization defaults match the validated 1x8 H20 run: LoRA r64, alpha=256,
# skip-layer=2, 10 denoising steps, and four SDE steps. Both recipes generate
# standard landscape 720p video (1280x720x5).
# SGLang holds a full transformer while FSDP trains LoRA; after every rollout,
# TensorWeightSync folds the adapter into the base weights and pushes the
# merged transformer. This avoids the known online-SGLang-LoRA delta mismatch.
#
# Launch (1 node x 8 GPUs):
#   bash examples/run_experiment_single_node.sh diffusion/hunyuan_video/hunyuan_video_t2v_sglang

defaults:
  - /_base/diffusion/hunyuan_video
  - _self_
num_rollouts: 1000

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  run_name: ${oc.env:WANDB_RUN_NAME,hunyuan_video_t2v_sglang}
  tags: [hunyuan_video, t2v, grpo, sglang, loramerge, lora-r64, v2]
  log_media: false
  media_max_items: 8
  media_log_interval: 1

# Shared by the trainside replay pipeline and the SGLang rollout engine.
model_config:
  _target_: unirl.models.hunyuan_video.config.HunyuanVideoPipelineConfig
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,hunyuanvideo-community/HunyuanVideo}
  model_precision: bf16
  vae_use_tiling: true
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  shift: 5.0
  hidden_state_skip_layer: 2
  # SGLang receives merged full weights, not an online LoRA adapter.
  use_lora: false

strategy:
  _target_: unirl.sde.kernels.FlowSDEStrategy

bundle:
  config: ${model_config}

pipeline:
  shift: ${model_config.shift}
  hidden_state_skip_layer: ${model_config.hidden_state_skip_layer}
  autocast_precision: ${model_config.autocast_precision}
  trajectory_precision: ${model_config.trajectory_precision}
  logprob_precision: ${model_config.logprob_precision}
  strategy: ${strategy}

rollout:
  _target_: unirl.rollout.engine.sglang_diffusion.engine.SGLangDiffusionRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang_diffusion.config.SGLangDiffusionEngineConfig
    model_family: hunyuan_video
    populate_conditions: true
    init_same_noise: ${sampling.init_same_noise}
    forward_batch_size: 1
    num_gpus: 1
    tp_size: 1
    local_mode: true
  model_config: ${model_config}
  strategy: ${strategy}

algorithm:
  old_logp_source: rollout
weight_sync_interval: 1

sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: true
  adapter_name: default
  bucket_size_mb: 512
  flush_cache: true
  name_remap: {"*": "transformer.*"}
