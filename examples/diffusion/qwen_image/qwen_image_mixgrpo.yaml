# @package _global_
# Qwen-Image + MixGRPO trainside (FSDP) colocate, v2 trainer, GRPO.
# Derived from qwen_image_trainside.yaml; canonical MixGRPO recipe is sd3_mixgrpo.yaml.
#
# MixGRPO = FlowGRPO + Flow SDE + a progressive sliding-window SDE-index
# scheduler. The ONLY differences from qwen_image_trainside are the scheduler
# (AllSDEScheduler -> WindowScheduler, strategy=progressive) and init_same_noise.
# The SDE kernel stays FlowSDEStrategy (same as the FlowGRPO base).
# Sliding-window hyperparameters aligned with Tencent MixGRPO defaults.

defaults:
  - /_base/diffusion/qwen_image
  - _self_
logging:
  report_to_wandb: false        # flip to true to enable wandb (rank-0/driver only)
  project_name: unirl
  run_name: qwen_image_mixgrpo
  entity:
  tags: ["qwen-image", "mixgrpo", "grpo", "trainside", "v2"]

bundle:
  config:
    _target_: unirl.models.qwen_image.config.QwenImagePipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN_IMAGE_PATH,Qwen/Qwen-Image}
    model_precision: bf16
    max_sequence_length: 512
    # Static-shift fallback; the real checkpoint enables dynamic shifting via
    # scheduler/scheduler_config.json and this value is ignored at runtime.
    shift: 3.0

# Pipeline relies on the optional-stages constructor (mirrors SD3): the
# trainer auto-injects `bundle=self.bundle`; text_embed/diffusion/vae_decode
# are built from the bundle here using the precision policy below.
pipeline:
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    # JointAttnProcessor naming — image stream (to_q/k/v, to_out.0) plus
    # text stream (add_*_proj, to_add_out). Verified against the diffusers
    # QwenImageTransformer2DModel attention layer.
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  # Qwen-Image VAE + text encoder are heavy; chunk forward to 1 sample at a
  # time. Mirrors v1 `rollout.plan.forward_batch_size: 1`.
  forward_batch_size: 1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  clip_range: 1.0e-4
  clip_schedule: constant
stack:
  num_updates_per_batch: 2      # PPO mini-batches per rollout (π_old frozen once); v1 parity

sampling:
  eta: 0.7
  init_same_noise: true            # MixGRPO shares the initial noise across the group
  # Progressive sliding-window SDE-index schedule (MixGRPO). The window of
  # SDE-recorded steps advances with the rollout id; rolls back to the start
  # once it sweeps the schedule.
  scheduler:
    _target_: unirl.sde.scheduler.WindowScheduler
    config:
      _target_: unirl.sde.scheduler.WindowConfig
      strategy: progressive
      window_size: 4
      iters_per_window: 25
      init_timestep: 0
      overlap_size: 1
      roll_back: true
      max_iters_per_window: 10
      min_iters_per_window: 1
